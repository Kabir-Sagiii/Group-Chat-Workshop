<!DOCTYPE html>
<html>
  <head>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        height: 100vh;
        background-color: black;
      }
      header {
        height: 13%;
        background-color: coral;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      header h1 {
        color: white;
        font-size: 37px;
        text-shadow: 0 0 10px black;
      }
      main {
        height: 77%;
        background-color: white;
        display: flex;
        flex-direction: column;
        padding: 10px;
        gap: 20px;
        overflow-y: auto;
      }
      footer {
        height: 10%;
        background-color: whitesmoke;
        box-shadow: 0 0 10px black;
        padding: 10px;
      }
      #form {
        height: 100%;
        display: flex;
        gap: 10px;
      }
      #form input {
        width: 100%;
        border: 1px solid #ccc;
        outline: none;
        border-radius: 50px;
        padding: 10px;
      }
      #form input:focus {
        box-shadow: 0 0 10px coral;
      }
      #form button {
        padding: 7px 20px;
        border: none;
        outline: none;
        border-radius: 50px;
        background-color: coral;
        color: white;
        font-weight: bold;
      }
      .send {
        background-color: green;
        color: white;
        padding: 10px 30px;
        align-self: flex-end;
        border-top-left-radius: 20px;
        border-bottom-right-radius: 20px;
      }
      .received {
        background-color: rgb(66, 63, 63);
        color: white;
        padding: 10px 30px;
        align-self: flex-start;
        border-top-right-radius: 20px;
        border-bottom-left-radius: 20px;
      }
    </style>
  </head>

  <body>
    <header>
      <h1>Modern Way To Connect</h1>
    </header>

    <main></main>

    <footer>
      <form id="form" onsubmit="sendDataToServer(event)">
        <input type="text" placeholder="Type Message Here...." />
        <button>Send</button>
      </form>
    </footer>

    <!--Integrating with Socket IO-->
    <script src="/socket.io/socket.io.js"></script>
    <script>
      //It is used to send connection request
      const socket = io();
      var main = document.querySelector("main");

      //On click on send button, send data to server
      function sendDataToServer(event) {
        event.preventDefault();
        var inputDomElement = document.querySelector("input");

        var message = inputDomElement.value;

        //sending data to server
        socket.emit("chat message", message);

        //create a div element
        const div = document.createElement("div");

        //assign css class to div element
        div.classList.add("send");

        //assign textbox data to div element
        div.textContent = message;

        //Add div element inside the main section
        main.appendChild(div);

        main.scrollTop = mainDomElement.scrollHeight;
      }

      //receving the data from server
      socket.on("chat message", (my_message) => {
        //ccreate div element
        const div = document.createElement("div");

        //assign message received from server to div element
        div.textContent = my_message;

        //add received css class to div element
        div.classList.add("received");

        //add div element into the main section
        main.appendChild(div);

        //get the controll of scrollbar to the bottom of new message
        main.scrollTop = mainDomElement.scrollHeight;
      });
    </script>
  </body>
</html>
